<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LittleLoom Admin - Login</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js">
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 50%, #0f0f1a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 48px 40px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.4);
        }
        .login-header {
            text-align: center;
            margin-bottom: 32px;
        }
        .login-header .logo {
            font-size: 48px;
            margin-bottom: 8px;
        }
        .login-header h1 {
            color: #fff;
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }
        .login-header p {
            color: rgba(255, 255, 255, 0.5);
            font-size: 14px;
            margin-top: 4px;
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            color: rgba(255, 255, 255, 0.7);
            font-size: 13px;
            font-weight: 600;
            display: block;
            margin-bottom: 4px;
        }
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            font-size: 15px;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s;
        }
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
        }
        .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }
        .btn-login {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 8px;
        }
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(102, 126, 234, 0.35);
        }
        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .error-msg {
            color: #ef4444;
            font-size: 13px;
            margin-top: 8px;
            text-align: center;
            display: none;
        }
        .error-msg.show {
            display: block;
        }
        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 8px;
        }
        .status-dot.connected {
            background: #22c55e;
        }
        .status-dot.disconnected {
            background: #ef4444;
        }
        .status-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px 16px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.03);
            margin-bottom: 16px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.6);
        }
        .footer-links {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.3);
        }
        .footer-links a {
            color: rgba(255, 255, 255, 0.5);
            text-decoration: none;
        }
        .footer-links a:hover {
            color: #667eea;
        }
        .quick-login {
            margin-top: 16px;
            padding: 12px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px dashed rgba(255, 255, 255, 0.06);
            text-align: center;
        }
        .quick-login p {
            color: rgba(255, 255, 255, 0.3);
            font-size: 12px;
            margin-bottom: 8px;
        }
        .quick-login .btn-sm {
            padding: 6px 16px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            background: transparent;
            color: rgba(255, 255, 255, 0.5);
            font-size: 12px;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s;
        }
        .quick-login .btn-sm:hover {
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <div class="logo">🧵</div>
            <h1>LittleLoom</h1>
            <p>Admin Dashboard Login</p>
        </div>

        <div class="status-bar">
            <span class="status-dot" id="statusDot"></span>
            <span id="statusText">Checking connection...</span>
        </div>

        <div id="errorMsg" class="error-msg"></div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" placeholder="your@email.com" required />
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="••••••••" required />
            </div>
            <button type="submit" class="btn-login" id="loginBtn">Sign In</button>
        </form>

        <div class="quick-login">
            <p>💡 Use your Supabase email/password</p>
            <p style="font-size:11px;color:rgba(255,255,255,0.2);margin-top:4px;">
                The same credentials you use for your Supabase dashboard
            </p>
        </div>

        <div class="footer-links">
            <a href="#" onclick="showHelp()">Need help?</a> · 
            <a href="https://supabase.com/dashboard" target="_blank">Supabase Console</a>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://qoozrrljpgsyhxfqxnzf.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_RNzz7jvsGmrRp9c94JiPuA_ooZt_gmm';

        let supabase = null;
        let isLoggingIn = false;

        // Initialize Supabase
        function initSupabase() {
            try {
                supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                updateStatus(true, 'Connected to Supabase');
                return true;
            } catch (e) {
                updateStatus(false, 'Connection failed');
                return false;
            }
        }

        function updateStatus(connected, message) {
            const dot = document.getElementById('statusDot');
            const text = document.getElementById('statusText');
            dot.className = `status-dot ${connected ? 'connected' : 'disconnected'}`;
            text.textContent = message || (connected ? 'Connected' : 'Disconnected');
        }

        function showError(message) {
            const el = document.getElementById('errorMsg');
            el.textContent = message;
            el.className = 'error-msg show';
            setTimeout(() => { el.className = 'error-msg'; }, 5000);
        }

        async function handleLogin(e) {
            e.preventDefault();
            if (isLoggingIn) return;

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const btn = document.getElementById('loginBtn');

            if (!email || !password) {
                showError('Please enter both email and password');
                return;
            }

            isLoggingIn = true;
            btn.disabled = true;
            btn.innerHTML = '<span class="loading-spinner"></span> Signing in...';

            try {
                const { data, error } = await supabase.auth.signInWithPassword({
                    email: email,
                    password: password
                });

                if (error) {
                    showError(error.message);
                    btn.innerHTML = 'Sign In';
                    btn.disabled = false;
                    isLoggingIn = false;
                    return;
                }

                if (data.session) {
                    // Save session to localStorage
                    localStorage.setItem('supabase_session', JSON.stringify(data.session));
                    // Redirect to dashboard
                    window.location.href = 'dashboard.html';
                } else {
                    showError('No session returned. Please try again.');
                    btn.innerHTML = 'Sign In';
                    btn.disabled = false;
                    isLoggingIn = false;
                }
            } catch (err) {
                showError('An error occurred. Please try again.');
                console.error('Login error:', err);
                btn.innerHTML = 'Sign In';
                btn.disabled = false;
                isLoggingIn = false;
            }
        }

        function showHelp() {
            alert(
                '🔑 Login Help\n\n' +
                'Use your Supabase credentials:\n' +
                '• Email: Your Supabase account email\n' +
                '• Password: Your Supabase account password\n\n' +
                'If you don\'t have an account, create one at:\n' +
                'https://supabase.com/dashboard'
            );
        }

        // Check if already logged in
        async function checkExistingSession() {
            try {
                const stored = localStorage.getItem('supabase_session');
                if (stored) {
                    const session = JSON.parse(stored);
                    // Verify session is still valid
                    const { data, error } = await supabase.auth.getSession();
                    if (!error && data.session) {
                        window.location.href = 'dashboard.html';
                        return;
                    } else {
                        localStorage.removeItem('supabase_session');
                    }
                }
            } catch (e) {
                // Ignore
            }
            updateStatus(false, 'Please sign in');
        }

        // Init
        if (initSupabase()) {
            checkExistingSession();
        }

        // Enter key support
        document.getElementById('password').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                document.getElementById('loginForm').dispatchEvent(new Event('submit'));
            }
        });
    </script>
</body>
</html>
