<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - LittleLoom Admin</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js">
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
            padding: 20px;
            position: relative;
            overflow: hidden;
        }
        body::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -30%;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.1) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }
        body::after {
            content: '';
            position: absolute;
            bottom: -40%;
            left: -20%;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(139, 92, 246, 0.08) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }
        .login-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 48px 40px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            position: relative;
            z-index: 1;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .login-header {
            text-align: center;
            margin-bottom: 32px;
        }
        .login-header .logo {
            font-size: 56px;
            margin-bottom: 12px;
            display: block;
        }
        .login-header h1 {
            font-size: 24px;
            font-weight: 800;
            color: #0f172a;
            letter-spacing: -0.5px;
        }
        .login-header h1 span {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .login-header p {
            color: #64748b;
            font-size: 14px;
            margin-top: 4px;
        }
        .form-group {
            margin-bottom: 16px;
            position: relative;
        }
        .form-group label {
            display: block;
            font-weight: 600;
            font-size: 13px;
            color: #475569;
            margin-bottom: 4px;
        }
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1.5px solid #e2e8f0;
            font-size: 14px;
            font-family: inherit;
            transition: all 0.2s;
            background: #f8fafc;
            padding-right: 48px;
        }
        .form-group input:focus {
            outline: none;
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
            background: #fff;
        }
        .form-group input::placeholder {
            color: #94a3b8;
        }
        .form-group input:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .password-toggle {
            position: absolute;
            right: 12px;
            bottom: 12px;
            background: none;
            border: none;
            cursor: pointer;
            color: #94a3b8;
            font-size: 20px;
            padding: 4px;
            border-radius: 8px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
        }
        .password-toggle:hover {
            color: #6366f1;
            background: rgba(99, 102, 241, 0.08);
        }
        .btn-login {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
            margin-top: 8px;
            position: relative;
            overflow: hidden;
        }
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(99, 102, 241, 0.4);
        }
        .btn-login:active {
            transform: translateY(0);
        }
        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .login-error {
            background: #fee2e2;
            color: #dc2626;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 13px;
            margin-bottom: 16px;
            display: none;
            align-items: center;
            gap: 8px;
            border: 1px solid #fecaca;
        }
        .login-error.show {
            display: flex;
        }
        .login-footer {
            text-align: center;
            margin-top: 24px;
            font-size: 13px;
            color: #94a3b8;
        }
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 8px;
        }
        .remember-me input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: #6366f1;
            cursor: pointer;
        }
        .remember-me label {
            font-size: 13px;
            color: #475569;
            cursor: pointer;
        }
        @media (max-width: 480px) {
            .login-container {
                padding: 32px 24px;
            }
            .login-header .logo {
                font-size: 40px;
            }
            .login-header h1 {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <span class="logo">🧵</span>
            <h1>Little<span>Loom</span></h1>
            <p>Sign in to manage your community</p>
        </div>

        <div class="login-error" id="loginError">
            <span>⚠️</span>
            <span id="errorMessage">Invalid email or password</span>
        </div>

        <form id="loginForm" onsubmit="handleLoginSubmit(event)">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="Enter your email" required autocomplete="email" />
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter your password" required autocomplete="current-password" />
                <button type="button" class="password-toggle" id="passwordToggle" onclick="togglePasswordVisibility()" aria-label="Toggle password visibility">
                    👁️
                </button>
            </div>
            <div class="remember-me">
                <input type="checkbox" id="rememberMe" checked />
                <label for="rememberMe">Remember me</label>
            </div>
            <button type="submit" class="btn-login" id="loginBtn">
                Sign In
            </button>
        </form>

        <div class="login-footer">
            Secure admin access • Powered by Supabase
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://qoozrrljpgsyhxfqxnzf.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_RNzz7jvsGmrRp9c94JiPuA_ooZt_gmm';
        let supabase = null;
        let passwordVisible = false;
        let loginAttempts = 0;
        const MAX_LOGIN_ATTEMPTS = 5;

        function initSupabase() {
            try {
                supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                return true;
            } catch (e) {
                console.error('Supabase init error:', e);
                return false;
            }
        }

        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('password');
            const toggleBtn = document.getElementById('passwordToggle');
            passwordVisible = !passwordVisible;
            passwordInput.type = passwordVisible ? 'text' : 'password';
            toggleBtn.textContent = passwordVisible ? '🙈' : '👁️';
            toggleBtn.setAttribute('aria-label', passwordVisible ? 'Hide password' : 'Show password');
        }

        async function handleLoginSubmit(e) {
            e.preventDefault();

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const btn = document.getElementById('loginBtn');
            const errorEl = document.getElementById('loginError');
            const errorMsg = document.getElementById('errorMessage');

            errorEl.classList.remove('show');

            // Rate limiting
            if (loginAttempts >= MAX_LOGIN_ATTEMPTS) {
                errorMsg.textContent = 'Too many login attempts. Please wait 5 minutes.';
                errorEl.classList.add('show');
                btn.disabled = true;
                setTimeout(() => {
                    btn.disabled = false;
                    loginAttempts = 0;
                }, 300000);
                return;
            }

            if (!email || !password) {
                errorMsg.textContent = 'Please fill in all fields';
                errorEl.classList.add('show');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span> Signing in...';

            try {
                if (!supabase) {
                    if (!initSupabase()) {
                        throw new Error('Failed to initialize connection');
                    }
                }

                const { data, error } = await supabase.auth.signInWithPassword({
                    email,
                    password
                });

                if (error) {
                    loginAttempts++;
                    if (error.message.includes('Invalid login credentials')) {
                        throw new Error('Invalid email or password');
                    } else if (error.message.includes('Email not confirmed')) {
                        // Try to resend confirmation
                        try {
                            await supabase.auth.resend({
                                type: 'signup',
                                email: email
                            });
                            throw new Error('Please verify your email address. A new confirmation link has been sent.');
                        } catch {
                            throw new Error('Please verify your email address before signing in.');
                        }
                    } else {
                        throw new Error(error.message);
                    }
                }

                // Reset login attempts on success
                loginAttempts = 0;

                // Store session info
                localStorage.setItem('lastActivity', Date.now().toString());
                
                // Check if remember me is checked
                if (document.getElementById('rememberMe').checked) {
                    localStorage.setItem('rememberedEmail', email);
                } else {
                    localStorage.removeItem('rememberedEmail');
                }

                window.location.href = '/admin/dashboard.html';

            } catch (e) {
                errorMsg.textContent = e.message || 'Something went wrong. Please try again.';
                errorEl.classList.add('show');
                btn.disabled = false;
                btn.innerHTML = 'Sign In';
            }
        }

        // Check if already logged in
        async function checkSession() {
            if (!initSupabase()) return;
            try {
                const { data } = await supabase.auth.getSession();
                if (data?.session) {
                    window.location.href = '/admin/dashboard.html';
                }
            } catch (e) {
                console.log('Session check failed:', e);
            }
        }

        // Restore remembered email
        function restoreRememberedEmail() {
            const remembered = localStorage.getItem('rememberedEmail');
            if (remembered) {
                document.getElementById('email').value = remembered;
                document.getElementById('rememberMe').checked = true;
            }
        }

        // Enter key support
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                const form = document.getElementById('loginForm');
                if (form) form.dispatchEvent(new Event('submit'));
            }
        });

        document.addEventListener('DOMContentLoaded', function() {
            checkSession();
            restoreRememberedEmail();
        });
    </script>
</body>
</html>
