<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - LittleLoom Admin</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js">
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            padding: 20px;
            -webkit-font-smoothing: antialiased;
        }

        .login-container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 48px 40px;
            max-width: 420px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.5);
        }

        .login-header {
            text-align: center;
            margin-bottom: 36px;
        }

        .login-header .logo {
            font-size: 48px;
            display: block;
            margin-bottom: 8px;
        }

        .login-header h1 {
            font-size: 28px;
            font-weight: 800;
            color: #fff;
            letter-spacing: -0.5px;
        }

        .login-header h1 span {
            color: #818cf8;
        }

        .login-header p {
            color: rgba(255, 255, 255, 0.5);
            font-size: 14px;
            margin-top: 4px;
        }

        .login-error {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 12px;
            padding: 12px 16px;
            display: none;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            color: #fca5a5;
            margin-bottom: 20px;
        }

        .login-error.show {
            display: flex;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1.5px solid rgba(255, 255, 255, 0.08);
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            transition: all 0.2s ease;
            outline: none;
        }

        .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.25);
        }

        .form-group input:focus {
            border-color: #818cf8;
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
        }

        .form-group input:-webkit-autofill {
            -webkit-box-shadow: 0 0 0 1000px #1e293b inset !important;
            -webkit-text-fill-color: #fff !important;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 16px 0 24px;
        }

        .remember-me input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #6366f1;
            cursor: pointer;
            border-radius: 4px;
        }

        .remember-me label {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.5);
            cursor: pointer;
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: #fff;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: 'Inter', sans-serif;
            position: relative;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(99, 102, 241, 0.35);
        }

        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }

        .btn-login .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .login-footer {
            text-align: center;
            margin-top: 28px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.25);
            letter-spacing: 0.3px;
        }

        /* ─── RESPONSIVE ────────────────────────────────────────────── */
        @media (max-width: 480px) {
            .login-container {
                padding: 32px 24px;
            }

            .login-header h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <span class="logo">🧵</span>
            <h1>Little<span>Loom</span></h1>
            <p>Sign in to manage your community</p>
        </div>

        <div class="login-error" id="loginError">
            <span>⚠️</span>
            <span id="errorMessage">Invalid email or password</span>
        </div>

        <form id="loginForm" onsubmit="handleLoginSubmit(event)">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="Enter your email" required autocomplete="email" />
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter your password" required autocomplete="current-password" />
            </div>
            <div class="remember-me">
                <input type="checkbox" id="rememberMe" checked />
                <label for="rememberMe">Remember me</label>
            </div>
            <button type="submit" class="btn-login" id="loginBtn">
                Sign In
            </button>
        </form>

        <div class="login-footer">
            Secure admin access • Powered by Supabase
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://qoozrrljpgsyhxfqxnzf.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_RNzz7jvsGmrRp9c94JiPuA_ooZt_gmm';
        const SUPER_ADMIN_ID = 'a3f834ef-7fa5-4732-9a03-af154806ac16';
        const SESSION_KEYS = {
            SESSION_DATA: 'littleloom_session_data',
            SESSION_EXPIRY: 'littleloom_session_expiry',
            REMEMBER_ME: 'littleloom_remember_me'
        };
        const SESSION_TIMEOUT_MINUTES = 30;

        let supabase = null;
        let loginAttempts = 0;
        const MAX_ATTEMPTS = 5;

        function initSupabase() {
            try {
                supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                return true;
            } catch (e) {
                console.error('Supabase init error:', e);
                return false;
            }
        }

        function showError(message) {
            const errorEl = document.getElementById('loginError');
            const msgEl = document.getElementById('errorMessage');
            if (errorEl && msgEl) {
                msgEl.textContent = message;
                errorEl.classList.add('show');
                setTimeout(() => errorEl.classList.remove('show'), 5000);
            }
        }

        async function ensureSuperAdminRole(userId) {
            try {
                const { data, error } = await supabase
                    .from('profiles')
                    .select('admin_role')
                    .eq('id', userId)
                    .single();

                if (error) {
                    console.warn('Error checking admin role:', error);
                    return;
                }

                if (userId === SUPER_ADMIN_ID && (!data || data.admin_role !== 'super_admin')) {
                    const { error: updateError } = await supabase
                        .from('profiles')
                        .update({
                            admin_role: 'super_admin',
                            updated_at: new Date().toISOString()
                        })
                        .eq('id', userId);

                    if (updateError) {
                        console.warn('Could not update admin role:', updateError);
                    } else {
                        console.log('✅ Super Admin role set for user:', userId);
                    }
                }
            } catch (e) {
                console.warn('Error ensuring super admin role:', e);
            }
        }

        async function handleLoginSubmit(e) {
            e.preventDefault();

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const rememberMe = document.getElementById('rememberMe').checked;
            const btn = document.getElementById('loginBtn');
            const errorEl = document.getElementById('loginError');

            errorEl.classList.remove('show');

            if (loginAttempts >= MAX_ATTEMPTS) {
                showError('Too many login attempts. Please wait 5 minutes.');
                btn.disabled = true;
                setTimeout(() => {
                    btn.disabled = false;
                    loginAttempts = 0;
                }, 300000);
                return;
            }

            if (!email || !password) {
                showError('Please fill in all fields');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span> Signing in...';

            try {
                if (!supabase) {
                    if (!initSupabase()) {
                        throw new Error('Failed to initialize connection');
                    }
                }

                const { data, error } = await supabase.auth.signInWithPassword({
                    email,
                    password
                });

                if (error) {
                    loginAttempts++;
                    if (error.message.includes('Invalid login credentials')) {
                        throw new Error('Invalid email or password');
                    } else if (error.message.includes('Email not confirmed')) {
                        throw new Error('Please verify your email address before signing in.');
                    } else {
                        throw new Error(error.message);
                    }
                }

                loginAttempts = 0;

                if (data?.session) {
                    await ensureSuperAdminRole(data.session.user.id);

                    const sessionData = {
                        user: data.session.user,
                        role: 'super_admin',
                        timestamp: Date.now()
                    };

                    const expiryTime = Date.now() + (SESSION_TIMEOUT_MINUTES * 60 * 1000);
                    sessionStorage.setItem(SESSION_KEYS.SESSION_DATA, JSON.stringify(sessionData));
                    sessionStorage.setItem(SESSION_KEYS.SESSION_EXPIRY, expiryTime.toString());

                    if (rememberMe) {
                        localStorage.setItem(SESSION_KEYS.SESSION_DATA, JSON.stringify(sessionData));
                        localStorage.setItem(SESSION_KEYS.SESSION_EXPIRY, expiryTime.toString());
                        localStorage.setItem(SESSION_KEYS.REMEMBER_ME, 'true');
                    } else {
                        localStorage.removeItem(SESSION_KEYS.REMEMBER_ME);
                    }

                    const redirect = new URLSearchParams(window.location.search).get('redirect') || '/admin/dashboard';
                    window.location.href = redirect;
                }

            } catch (e) {
                showError(e.message || 'Something went wrong. Please try again.');
                btn.disabled = false;
                btn.innerHTML = 'Sign In';
            }
        }

        async function checkExistingSession() {
            try {
                let data = sessionStorage.getItem(SESSION_KEYS.SESSION_DATA);
                let expiry = sessionStorage.getItem(SESSION_KEYS.SESSION_EXPIRY);

                if (!data) {
                    data = localStorage.getItem(SESSION_KEYS.SESSION_DATA);
                    expiry = localStorage.getItem(SESSION_KEYS.SESSION_EXPIRY);
                }

                if (data && expiry) {
                    const expiryTime = parseInt(expiry, 10);
                    if (Date.now() < expiryTime) {
                        if (!supabase) initSupabase();
                        const { data: sessionCheck, error } = await supabase.auth.getSession();
                        if (!error && sessionCheck?.session) {
                            window.location.href = '/admin/dashboard';
                            return true;
                        }
                    }
                }
                return false;
            } catch (e) {
                return false;
            }
        }

        document.addEventListener('DOMContentLoaded', async function() {
            if (!initSupabase()) return;

            const hasSession = await checkExistingSession();
            if (hasSession) return;

            document.getElementById('loginForm').addEventListener('submit', handleLoginSubmit);

            document.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    const active = document.activeElement;
                    if (active && (active.id === 'email' || active.id === 'password')) {
                        document.getElementById('loginForm').dispatchEvent(new Event('submit'));
                    }
                }
            });

            document.getElementById('email').focus();
        });
    </script>
</body>
</html>
