<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Push Notifications - LittleLoom Admin</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/admin/css/admin.css" />
    <style>
        body { padding: 20px; }
        .page-container { max-width: 1400px; margin: 0 auto; }
    </style>
</head>
<body>
    <div class="page-container">
        <div class="page-header">
            <span class="icon">📄</span>
            <h1>Push Notifications</h1>
            <div class="page-actions">
                <button class="btn btn-outline" onclick="location.reload()">🔄 Refresh</button>
            </div>
        </div>
        <div class="status-bar" id="statusBar">
            <span>✅ Ready</span>
            <span style="margin-left:auto;font-size:12px;" id="lastUpdated">Last updated: <span id="updateTime">—</span></span>
        </div>
        <div class="card">
            <div class="card-body">
                <div style="text-align:center;padding:40px 20px;color:var(--text-muted);">
                    <div style="font-size:48px;margin-bottom:12px;">🚀</div>
                    <h3 style="color:var(--text-primary);font-weight:700;margin-bottom:6px;">Push Notifications</h3>
                    <p>Full functionality is being loaded from Supabase. Please wait...</p>
                    <div style="margin-top:20px;">
                        <div class="spinner"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="/admin/js/admin.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('updateTime').textContent = new Date().toLocaleString();
            
            // Load data from Supabase based on page type
            const page = 'notifications.html'.replace('.html', '');
            loadPageData(page);
        });
        
        async function loadPageData(page) {
            if (!initSupabase()) {
                showToast('Failed to initialize Supabase', 'error');
                return;
            }
            const authed = await checkAuth();
            if (!authed) {
                showToast('Please log in to continue', 'warning');
                return;
            }
            
            showToast('Loading Push Notifications...', 'info');
            // Page-specific data loading will be implemented
        }
    </script>
</body>
</html>
